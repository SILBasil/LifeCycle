name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🛠️ Build Web Assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wukpkztwjgkcmwiflylu.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_-yPJ_XRGL6GMIERJ9shMUg_WchKkIK8' }}
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🤖 Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload LifeCycle APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeCycle-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
